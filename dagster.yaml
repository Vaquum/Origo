local_artifact_storage:
  module: dagster._core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir: /opt/dagster-instance

run_storage:
  module: origo.maintenance.run_storage
  class: OrigoSqliteRunStorage
  config:
    base_dir: /opt/dagster-instance

event_log_storage:
  module: origo.maintenance.event_storage
  class: OrigoSqliteEventLogStorage
  config:
    base_dir: /opt/dagster-instance

schedule_storage:
  module: dagster._core.storage.schedules
  class: SqliteScheduleStorage
  config:
    base_dir: /opt/dagster-instance

run_coordinator:
  module: origo.orchestration.coordinator
  class: OrigoQueuedRunCoordinator
  config:
    max_concurrent_runs: 19
    dequeue_use_threads: true
    dequeue_num_workers: 19
    dequeue_interval_seconds: 1
    tag_concurrency_limits:
      - key: origo/workload
        value: backfill
        limit: 10
      - key: origo/workload
        value: routine
        limit: 8
      - key: origo/workload
        value: maintenance
        limit: 1
      - key: origo/routine_job
        value:
          applyLimitPerUniqueValue: true
        limit: 2
      - key: origo/request_identity
        value:
          applyLimitPerUniqueValue: true
        limit: 1

run_launcher:
  module: origo.orchestration.launcher
  class: OrigoRunLauncher

run_monitoring:
  enabled: true
  start_timeout_seconds: 300
  cancel_timeout_seconds: 180
  max_runtime_seconds: 93600
  poll_interval_seconds: 120

concurrency:
  pools:
    default_limit: 1
    granularity: op

python_logs:
  managed_python_loggers:
    - ""
  python_log_level: INFO

compute_logs:
  module: dagster._core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /opt/dagster-instance/compute_logs

retention:
  sensor:
    purge_after_days:
      skipped: 1
      success: 1
      failure: 7
  schedule:
    purge_after_days:
      skipped: 1
      success: 1
      failure: 7
