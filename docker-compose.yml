services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse-config.xml:/etc/clickhouse-server/config.d/clickhouse-config.xml
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  dagit:
    build: .
    image: origo-dagster:latest
    ports:
      - "4000:3000"
    environment:
      - DAGSTER_HOME=/opt/app
      - PYTHONPATH=/opt/app
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGINGFACE_DATASET_REPO_ID=${HUGGINGFACE_DATASET_REPO_ID:-vaquum/binance_btcusdt_1m_klines}
    volumes:
      - .:/opt/app
      - dagster-instance:/opt/dagster-instance
      - source-locks:/opt/origo/locks
      - clickhouse-data:/opt/origo/clickhouse-data:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    command: dagit -h 0.0.0.0 -p 3000
    restart: unless-stopped

  dagster:
    build: .
    image: origo-dagster:latest
    environment:
      - DAGSTER_HOME=/opt/app
      - PYTHONPATH=/opt/app
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGINGFACE_DATASET_REPO_ID=${HUGGINGFACE_DATASET_REPO_ID:-vaquum/binance_btcusdt_1m_klines}
    volumes:
      - .:/opt/app
      - dagster-instance:/opt/dagster-instance
      - source-locks:/opt/origo/locks
      - clickhouse-data:/opt/origo/clickhouse-data:ro
      - ./parquet_data:/opt/parquet
      - ./arrow_data:/opt/arrow
    depends_on:
      clickhouse:
        condition: service_healthy
    command: dagster-daemon run
    restart: unless-stopped

volumes:
  clickhouse-data:
  dagster-instance:

  source-locks:
