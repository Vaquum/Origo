name: pr_checks_tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr_checks_tests:
    name: pr_checks_tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip '.[dev]'

      - name: Install browser for dashboard acceptance
        run: python -m playwright install --with-deps chromium

      - name: Pin Overview acceptance test entry points
        run: |
          pytest --collect-only -q \
            tests/origo_source_native/test_law_page.py::test_overview_totals_match_catalog_and_observed_evidence \
            tests/origo_source_native/test_monitor.py::test_overview_evidence_reuses_reads_and_preserves_unknowns \
            tests/origo_source_native/test_law_page.py::test_overview_layout_and_navigation_at_desktop_and_mobile_sizes \
            tests/origo_source_native/test_law_page.py::test_named_laws_filter_history_and_legacy_links \
            tests/origo_source_native/test_law_page.py::test_depth_recovery_uses_real_continuity_evidence \
            tests/origo_source_native/test_law_page.py::test_recovery_comparison_states_and_signed_change \
            tests/origo_source_native/test_monitor.py::test_publication_policy_evidence_reuses_existing_decisions \
            tests/origo_source_native/test_law_page.py::test_wait_and_publication_presentations_preserve_raw_evidence \
            tests/origo_source_native/test_law_page.py::test_overview_unknowns_override_stale_or_mismatched_numbers \
            tests/origo_source_native/test_law_page.py::test_history_concurrency_deadlines_and_current_refresh \
            tests/origo_source_native/test_law_page.py::test_named_laws_preserve_original_definitions_and_clear_window \
            tests/origo_source_native/test_law_page.py::test_served_page_layout_contract \
            tests/origo_source_native/test_law_page.py::test_operational_history_totals_preserve_intervals_and_limits \
            tests/origo_source_native/test_law_page.py::test_overview_production_shape_stays_within_resource_budgets

      - name: Execute raw-perp page-budget acceptance tests
        run: |
          pytest -q --junitxml=perp-page-budget.xml \
            tests/origo_source_native/test_binance_perp_efficiency.py::test_busy_perp_minute_exceeds_100_pages_and_matches_archive \
            tests/origo_source_native/test_binance_perp_efficiency.py::test_perp_page_cap_fails_without_end_witness \
            tests/origo_source_native/test_binance_perp_efficiency.py::test_perp_fallback_counts_against_page_cap \
            tests/origo_source_native/test_binance_perp_efficiency.py::test_page_caps_preserve_other_sources_and_request_budgets
          python - <<'PYTHON'
          from xml.etree import ElementTree

          suites = ElementTree.parse('perp-page-budget.xml').getroot().findall('testsuite')
          assert sum(int(suite.attrib['tests']) for suite in suites) == 4
          for outcome in ('skipped', 'failures', 'errors'):
              assert sum(int(suite.attrib[outcome]) for suite in suites) == 0, outcome
          PYTHON

      - name: Run Origo source-native runtime tests
        run: pytest tests/origo_source_native -q --maxfail=1

      - name: Verify daily-archive fixture bundles
        run: |
          for stem in BTCUSDT-trades-2019-09-08 BTCUSDT-trades-2019-09-09 BTCUSDT-trades-2024-04-20; do
            python3 tools/fixture_bundle.py verify --dir tests/fixtures/binance/futures/daily/trades/BTCUSDT --stem "$stem"
          done
          for stem in BTCUSDT-trades-2017-08-17 BTCUSDT-trades-2020-01-01; do
            python3 tools/fixture_bundle.py verify --dir tests/fixtures/binance/spot/daily/trades/revisioned --stem "$stem"
          done
