services:
  clickhouse:
    image: ${CLICKHOUSE_IMAGE:?CLICKHOUSE_IMAGE is required}
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  dagit:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    ports:
      - "127.0.0.1:4000:3000"
    environment:
      - DAGSTER_HOME=/opt/app
      - PYTHONPATH=/opt/app
      - DAGSTER_DEFAULT_IO_MANAGER_MODULE=origo.maintenance.io_manager
      - DAGSTER_DEFAULT_IO_MANAGER_ATTRIBUTE=packed_io_manager
      - ORIGO_METADATA_DRY_RUN=${ORIGO_METADATA_DRY_RUN:-true}
      - ORIGO_METADATA_MAX_RUNTIME_SECONDS=${ORIGO_METADATA_MAX_RUNTIME_SECONDS:-600}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      - HF_TOKEN=${HF_TOKEN:?HF_TOKEN is required}
      - HUGGINGFACE_DATASET_REPO_ID=${HUGGINGFACE_DATASET_REPO_ID:?HUGGINGFACE_DATASET_REPO_ID is required}
      - BINANCE_SPOT_DEPTH20_BASE_URL=${BINANCE_SPOT_DEPTH20_BASE_URL:?BINANCE_SPOT_DEPTH20_BASE_URL is required}
      - BINANCE_SPOT_DEPTH20_AUTH_TOKEN=${BINANCE_SPOT_DEPTH20_AUTH_TOKEN:?BINANCE_SPOT_DEPTH20_AUTH_TOKEN is required}
      - BINANCE_SPOT_DEPTH200_BASE_URL=${BINANCE_SPOT_DEPTH200_BASE_URL:?BINANCE_SPOT_DEPTH200_BASE_URL is required}
      - BINANCE_SPOT_DEPTH200_AUTH_TOKEN=${BINANCE_SPOT_DEPTH200_AUTH_TOKEN:?BINANCE_SPOT_DEPTH200_AUTH_TOKEN is required}
    volumes:
      - dagster-instance:/opt/dagster-instance
      - source-locks:/opt/origo/locks
      - source-publications:/opt/origo/shadow
      - clickhouse-data:/opt/origo/clickhouse-data:ro
      - tdw-parquet:/opt/parquet
      - tdw-arrow:/opt/arrow
    depends_on:
      clickhouse:
        condition: service_healthy
    command: dagit -h 0.0.0.0 -p 3000
    restart: unless-stopped

  dagster:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    environment:
      - DAGSTER_HOME=/opt/app
      - PYTHONPATH=/opt/app
      - DAGSTER_DEFAULT_IO_MANAGER_MODULE=origo.maintenance.io_manager
      - DAGSTER_DEFAULT_IO_MANAGER_ATTRIBUTE=packed_io_manager
      - ORIGO_METADATA_DRY_RUN=${ORIGO_METADATA_DRY_RUN:-true}
      - ORIGO_METADATA_MAX_RUNTIME_SECONDS=${ORIGO_METADATA_MAX_RUNTIME_SECONDS:-600}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      - HF_TOKEN=${HF_TOKEN:?HF_TOKEN is required}
      - BINANCE_API_KEY=${BINANCE_API_KEY:?BINANCE_API_KEY is required}
      - HUGGINGFACE_DATASET_REPO_ID=${HUGGINGFACE_DATASET_REPO_ID:?HUGGINGFACE_DATASET_REPO_ID is required}
      - BINANCE_SPOT_DEPTH20_BASE_URL=${BINANCE_SPOT_DEPTH20_BASE_URL:?BINANCE_SPOT_DEPTH20_BASE_URL is required}
      - BINANCE_SPOT_DEPTH20_AUTH_TOKEN=${BINANCE_SPOT_DEPTH20_AUTH_TOKEN:?BINANCE_SPOT_DEPTH20_AUTH_TOKEN is required}
      - BINANCE_SPOT_DEPTH200_BASE_URL=${BINANCE_SPOT_DEPTH200_BASE_URL:?BINANCE_SPOT_DEPTH200_BASE_URL is required}
      - BINANCE_SPOT_DEPTH200_AUTH_TOKEN=${BINANCE_SPOT_DEPTH200_AUTH_TOKEN:?BINANCE_SPOT_DEPTH200_AUTH_TOKEN is required}
    volumes:
      - dagster-instance:/opt/dagster-instance
      - source-locks:/opt/origo/locks
      - source-publications:/opt/origo/shadow
      - clickhouse-data:/opt/origo/clickhouse-data:ro
      - tdw-parquet:/opt/parquet
      - tdw-arrow:/opt/arrow
    depends_on:
      clickhouse:
        condition: service_healthy
    command: ["/bin/sh", "-ec", "python -m origo.sources.bootstrap && exec dagster-daemon run"]
    healthcheck:
      test: ["CMD", "python", "-m", "origo.sources.prepare", "--check"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  monitor:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    environment:
      - PYTHONPATH=/opt/app
      - DAGSTER_WEBSERVER_URL=http://dagit:3000
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      - BINANCE_SPOT_DEPTH20_BASE_URL=${BINANCE_SPOT_DEPTH20_BASE_URL:?BINANCE_SPOT_DEPTH20_BASE_URL is required}
      - BINANCE_SPOT_DEPTH20_AUTH_TOKEN=${BINANCE_SPOT_DEPTH20_AUTH_TOKEN:?BINANCE_SPOT_DEPTH20_AUTH_TOKEN is required}
      - BINANCE_SPOT_DEPTH200_BASE_URL=${BINANCE_SPOT_DEPTH200_BASE_URL:?BINANCE_SPOT_DEPTH200_BASE_URL is required}
      - BINANCE_SPOT_DEPTH200_AUTH_TOKEN=${BINANCE_SPOT_DEPTH200_AUTH_TOKEN:?BINANCE_SPOT_DEPTH200_AUTH_TOKEN is required}
      - ORIGO_ALERT_RESEND_API_KEY=${RESEND_API_KEY:?RESEND_API_KEY is required}
      - ORIGO_ALERT_EMAIL_FROM=${ORIGO_ALERT_EMAIL_FROM:-onboarding@resend.dev}
      - ORIGO_ALERT_EMAIL_TO=${ORIGO_ALERT_EMAIL_TO:?ORIGO_ALERT_EMAIL_TO is required}
      - ORIGO_ALERT_COOLDOWN_SECONDS=${ORIGO_ALERT_COOLDOWN_SECONDS:-21600}
      - ORIGO_ALERT_QUEUE_THRESHOLD=${ORIGO_ALERT_QUEUE_THRESHOLD:-200}
      - ORIGO_ALERT_DIGEST_HOUR_UTC=${ORIGO_ALERT_DIGEST_HOUR_UTC:-7}
    volumes:
      - worker-heartbeats:/opt/origo/heartbeats
      - source-publications:/opt/origo/shadow:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    command: python -m origo.workers.monitor
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-m", "origo.workers.monitor", "--check"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  vector:
    image: timberio/vector:0.58.0-alpine
    environment:
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}
      # Vector 0.58 leaves ${...} references in its configuration literal unless told to
      # interpolate them; the configuration is a read-only mount in a container that runs
      # nothing else.
      - VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/vector.yaml:/etc/vector/vector.yaml:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  depth-worker:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    environment:
      - PYTHONPATH=/opt/app
      - DAGSTER_WEBSERVER_URL=http://dagit:3000
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      - BINANCE_SPOT_DEPTH20_BASE_URL=${BINANCE_SPOT_DEPTH20_BASE_URL:?BINANCE_SPOT_DEPTH20_BASE_URL is required}
      - BINANCE_SPOT_DEPTH20_AUTH_TOKEN=${BINANCE_SPOT_DEPTH20_AUTH_TOKEN:?BINANCE_SPOT_DEPTH20_AUTH_TOKEN is required}
      - BINANCE_SPOT_DEPTH200_BASE_URL=${BINANCE_SPOT_DEPTH200_BASE_URL:?BINANCE_SPOT_DEPTH200_BASE_URL is required}
      - BINANCE_SPOT_DEPTH200_AUTH_TOKEN=${BINANCE_SPOT_DEPTH200_AUTH_TOKEN:?BINANCE_SPOT_DEPTH200_AUTH_TOKEN is required}
    volumes:
      - tdw-arrow:/opt/arrow
      - source-locks:/opt/origo/locks
      - worker-heartbeats:/opt/origo/heartbeats
    depends_on:
      clickhouse:
        condition: service_healthy
    command: python -m origo.workers.depth
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "python", "-m", "origo.workers.depth", "--check"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  provisional-worker: &provisional-worker
    image: ${APP_IMAGE:?APP_IMAGE is required}
    environment: &provisional-environment
      PYTHONPATH: /opt/app
      DAGSTER_WEBSERVER_URL: http://dagit:3000
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      HF_TOKEN: ${HF_TOKEN:?HF_TOKEN is required}
      BINANCE_API_KEY: ${BINANCE_API_KEY:?BINANCE_API_KEY is required}
      HUGGINGFACE_DATASET_REPO_ID: ${HUGGINGFACE_DATASET_REPO_ID:?HUGGINGFACE_DATASET_REPO_ID is required}
      ORIGO_PROVISIONAL_SOURCE: binance_spot_trades
    volumes:
      - tdw-parquet:/opt/parquet
      - tdw-arrow:/opt/arrow
      - source-locks:/opt/origo/locks
      - source-publications:/opt/origo/shadow
      - worker-heartbeats:/opt/origo/heartbeats
    depends_on:
      clickhouse:
        condition: service_healthy
    command: python -m origo.workers.provisional
    # The mount render peaks above 5 GiB of RSS (measured 2026-09-17); the limit keeps a
    # leak from starving the host without killing a normal render.
    mem_limit: 16g
    healthcheck:
      test: ["CMD", "python", "-m", "origo.workers.provisional", "--check"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  provisional-binance-perp-trades:
    <<: *provisional-worker
    environment:
      <<: *provisional-environment
      ORIGO_PROVISIONAL_SOURCE: binance_perp_trades

  provisional-binance-spot-aggtrades:
    <<: *provisional-worker
    environment:
      <<: *provisional-environment
      ORIGO_PROVISIONAL_SOURCE: binance_spot_aggtrades

  provisional-binance-perp-aggtrades:
    <<: *provisional-worker
    environment:
      <<: *provisional-environment
      ORIGO_PROVISIONAL_SOURCE: binance_perp_aggtrades

volumes:
  clickhouse-data:
    name: tdw-control-plane_clickhouse-data
    external: true
  dagster-instance:
    name: tdw-control-plane_dagster-instance
    external: true
  tdw-parquet:
    # Compose-managed (NOT external) so `docker compose up` creates it automatically
    # on deploy -- no manual `docker volume create` on the host. The name is pinned so
    # other services can mount it by a stable name. Holds reproducible mirror output
    # (rebuildable via the backfill job), so it does not need the external protection
    # the clickhouse-data / dagster-instance volumes have.
    name: tdw-control-plane_parquet
  tdw-arrow:
    # Compose-managed, same rationale as tdw-parquet: holds the versioned Arrow bar
    # store, which is fully reproducible from the Parquet mirror (re-materialize the
    # build_bar_store_arrow asset). Dagster is the sole writer; consumers mount this
    # volume read-only by the pinned name.
    name: tdw-control-plane_arrow

  source-locks:

  source-publications:

  worker-heartbeats:
