name: Deploy On Merge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Build Images And Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ORIGO_HOST: ${{ vars.ORIGO_HOST }}
      ORIGO_USER: ${{ vars.ORIGO_USER }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      PROJECT_NAME: ${{ vars.ORIGO_PROJECT_NAME }}
      HUGGINGFACE_DATASET_REPO_ID: ${{ vars.HUGGINGFACE_DATASET_REPO_ID }}
      ORIGO_KNOWN_HOSTS: ${{ vars.ORIGO_KNOWN_HOSTS }}
      ORIGO_METADATA_DRY_RUN: ${{ vars.ORIGO_METADATA_DRY_RUN || 'true' }}
      ORIGO_METADATA_MAX_RUNTIME_SECONDS: ${{ vars.ORIGO_METADATA_MAX_RUNTIME_SECONDS || '600' }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ORIGO_ALERT_EMAIL_FROM: ${{ vars.ORIGO_ALERT_EMAIL_FROM || 'onboarding@resend.dev' }}
      ORIGO_ALERT_EMAIL_TO: ${{ vars.ORIGO_ALERT_EMAIL_TO }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deploy configuration
        run: |
          test -n "$ORIGO_HOST"
          test -n "$ORIGO_USER"
          test -n "$DEPLOY_DIR"
          test -n "$PROJECT_NAME"
          test -n "$HUGGINGFACE_DATASET_REPO_ID"
          test -n "$ORIGO_KNOWN_HOSTS"
          test -n "$RESEND_API_KEY"
          test -n "$ORIGO_ALERT_EMAIL_FROM"
          test -n "$ORIGO_ALERT_EMAIL_TO"

      - name: Set image names
        run: |
          echo "APP_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/origo-dagster:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "APP_IMAGE_LATEST=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/origo-dagster:latest" >> "$GITHUB_ENV"
          echo "CLICKHOUSE_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/origo-clickhouse:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "CLICKHOUSE_IMAGE_LATEST=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/origo-clickhouse:latest" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Dagster image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.APP_IMAGE }}
            ${{ env.APP_IMAGE_LATEST }}

      - name: Build and push ClickHouse image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.clickhouse
          push: true
          tags: |
            ${{ env.CLICKHOUSE_IMAGE }}
            ${{ env.CLICKHOUSE_IMAGE_LATEST }}

      - name: Validate deploy compose file
        env:
          APP_IMAGE: ${{ env.APP_IMAGE }}
          CLICKHOUSE_IMAGE: ${{ env.CLICKHOUSE_IMAGE }}
          CLICKHOUSE_PASSWORD: test-password
          HF_TOKEN: test-token
          HUGGINGFACE_DATASET_REPO_ID: ${{ env.HUGGINGFACE_DATASET_REPO_ID }}
          BINANCE_SPOT_DEPTH20_BASE_URL: ${{ secrets.BINANCE_SPOT_DEPTH20_BASE_URL }}
          BINANCE_SPOT_DEPTH20_AUTH_TOKEN: ${{ secrets.BINANCE_SPOT_DEPTH20_AUTH_TOKEN }}
          BINANCE_SPOT_DEPTH200_BASE_URL: ${{ secrets.BINANCE_SPOT_DEPTH200_BASE_URL }}
          BINANCE_SPOT_DEPTH200_AUTH_TOKEN: ${{ secrets.BINANCE_SPOT_DEPTH200_AUTH_TOKEN }}
          RESEND_API_KEY: test-key
          ORIGO_ALERT_EMAIL_TO: ${{ env.ORIGO_ALERT_EMAIL_TO }}
        run: docker compose -f docker-compose.deploy.yml config > /dev/null

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORIGO_PRIVATE_KEY }}

      - name: Configure pinned deployment host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ORIGO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deploy compose file
        run: |
          ssh "$ORIGO_USER@$ORIGO_HOST" "mkdir -p '$DEPLOY_DIR/deploy'"
          scp docker-compose.deploy.yml "$ORIGO_USER@$ORIGO_HOST:$DEPLOY_DIR/docker-compose.deploy.yml"
          scp deploy/vector.yaml "$ORIGO_USER@$ORIGO_HOST:$DEPLOY_DIR/deploy/vector.yaml"

      - name: Deploy updated images
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BINANCE_SPOT_DEPTH20_BASE_URL: ${{ secrets.BINANCE_SPOT_DEPTH20_BASE_URL }}
          BINANCE_SPOT_DEPTH20_AUTH_TOKEN: ${{ secrets.BINANCE_SPOT_DEPTH20_AUTH_TOKEN }}
          BINANCE_SPOT_DEPTH200_BASE_URL: ${{ secrets.BINANCE_SPOT_DEPTH200_BASE_URL }}
          BINANCE_SPOT_DEPTH200_AUTH_TOKEN: ${{ secrets.BINANCE_SPOT_DEPTH200_AUTH_TOKEN }}
        run: |
          DEPLOY_ENV_FILE="/tmp/origo-deploy.env"
          trap 'rm -f "$DEPLOY_ENV_FILE"' EXIT

          python3 - <<'PY' > "$DEPLOY_ENV_FILE"
          import os
          import shlex

          values = {
              "GHCR_USERNAME": os.environ["GHCR_USERNAME"],
              "GHCR_TOKEN": os.environ["GHCR_TOKEN"],
              "APP_IMAGE": os.environ["APP_IMAGE"],
              "CLICKHOUSE_IMAGE": os.environ["CLICKHOUSE_IMAGE"],
              "CLICKHOUSE_PASSWORD": os.environ["CLICKHOUSE_PASSWORD"],
              "HF_TOKEN": os.environ["HF_TOKEN"],
              "BINANCE_SPOT_DEPTH20_BASE_URL": os.environ["BINANCE_SPOT_DEPTH20_BASE_URL"],
              "BINANCE_SPOT_DEPTH20_AUTH_TOKEN": os.environ["BINANCE_SPOT_DEPTH20_AUTH_TOKEN"],
              "BINANCE_SPOT_DEPTH200_BASE_URL": os.environ["BINANCE_SPOT_DEPTH200_BASE_URL"],
              "BINANCE_SPOT_DEPTH200_AUTH_TOKEN": os.environ["BINANCE_SPOT_DEPTH200_AUTH_TOKEN"],
              "HUGGINGFACE_DATASET_REPO_ID": os.environ["HUGGINGFACE_DATASET_REPO_ID"],
              "PROJECT_NAME": os.environ["PROJECT_NAME"],
              "ORIGO_METADATA_DRY_RUN": os.environ["ORIGO_METADATA_DRY_RUN"],
              "ORIGO_METADATA_MAX_RUNTIME_SECONDS": os.environ["ORIGO_METADATA_MAX_RUNTIME_SECONDS"],
              "RESEND_API_KEY": os.environ["RESEND_API_KEY"],
              "ORIGO_ALERT_EMAIL_FROM": os.environ["ORIGO_ALERT_EMAIL_FROM"],
              "ORIGO_ALERT_EMAIL_TO": os.environ["ORIGO_ALERT_EMAIL_TO"],
          }

          for key, value in values.items():
              print(f"{key}={shlex.quote(value)}")
          PY

          scp "$DEPLOY_ENV_FILE" "$ORIGO_USER@$ORIGO_HOST:$DEPLOY_DIR/.deploy.env"

          ssh "$ORIGO_USER@$ORIGO_HOST" \
            "DEPLOY_DIR='$DEPLOY_DIR' ORIGO_HOST='$ORIGO_HOST' bash -s" <<'REMOTE'
          set -euo pipefail

          export DOCKER_CONFIG
          DOCKER_CONFIG="$(mktemp -d)"
          SECRETS_FILE="$DEPLOY_DIR/.deploy.env"
          cleanup() {
            rm -rf "$DOCKER_CONFIG"
            rm -f "$SECRETS_FILE"
          }
          trap cleanup EXIT
          chmod 600 "$SECRETS_FILE"

          set -a
          . "$SECRETS_FILE"
          set +a

          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

          cd "$DEPLOY_DIR"
          docker compose -p "$PROJECT_NAME" -f docker-compose.deploy.yml pull
          # Save only worker identity; never serialize container environments.
          prior_workers=()
          for worker in $(docker compose -p "$PROJECT_NAME" -f docker-compose.deploy.yml ps -q dagster dagit); do
            prior_workers+=("$(docker inspect --format '{{.Id}} {{.Config.Hostname}}' "$worker")")
          done
          retirement_boundary=$(date +%s)
          docker compose -p "$PROJECT_NAME" -f docker-compose.deploy.yml up -d --wait --wait-timeout 600 clickhouse dagster dagit monitor vector \
            || { docker compose -p "$PROJECT_NAME" -f docker-compose.deploy.yml logs --tail 200 dagster; exit 1; }
          # Bootstrap runs before the daemon and the healthcheck passes on persisted state,
          # so wait for the exec into dagster-daemon before recovery contends for the queue lock.
          for attempt in $(seq 1 90); do
            if docker compose -p "$PROJECT_NAME" -f docker-compose.deploy.yml exec -T dagster sh -c 'grep -q dagster-daemon /proc/1/cmdline'; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              docker compose -p "$PROJECT_NAME" -f docker-compose.deploy.yml logs --tail 200 dagster
              echo "dagster-daemon did not start within 900 seconds" >&2
              exit 1
            fi
            sleep 10
          done
          existing_worker_ids="$(docker ps -aq --no-trunc)"
          recovery_args=(python -m origo.orchestration.recovery --deadline-seconds 900)
          retired_count=0
          for identity in "${prior_workers[@]}"; do
            read -r worker_id worker_hostname <<< "$identity"
            case $'\n'"$existing_worker_ids"$'\n' in
              *$'\n'"$worker_id"$'\n'*) running="$(docker inspect --format '{{.State.Running}}' "$worker_id")" ;;
              *) running=false ;;
            esac
            if [ "$running" = false ]; then
              recovery_args+=(--retired-worker "$worker_hostname")
              retired_count=$((retired_count + 1))
            fi
          done
          # Legacy runs have no owner tag. A timestamp is usable only when BOTH
          # former app containers, including their local gRPC workers, are gone.
          if [ "${#prior_workers[@]}" -eq 2 ] && [ "$retired_count" -eq 2 ]; then
            recovery_args+=(--legacy-before "$retirement_boundary")
          fi
          docker compose -p "$PROJECT_NAME" -f docker-compose.deploy.yml exec -T dagster \
            "${recovery_args[@]}"
          docker compose -p "$PROJECT_NAME" -f docker-compose.deploy.yml exec -T dagster python - <<'PY'
          from origo.utils.get_clickhouse_client import get_clickhouse_client

          rows = get_clickhouse_client().query("SELECT 1").result_rows
          if rows != [(1,)]:
              raise SystemExit(f"Unexpected ClickHouse smoke-test result: {rows}")
          print(rows)
          PY
          docker compose -p "$PROJECT_NAME" -f docker-compose.deploy.yml exec -T dagster \
            dagster job launch -j maintain_operational_metadata_job
          REMOTE

          rm -f "$DEPLOY_ENV_FILE"
