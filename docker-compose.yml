services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.3.2.39@sha256:8745843b17f92db1765025009772ec1d87dfdcaa95deabca6b802a66cb669d30
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse-config.xml:/etc/clickhouse-server/config.d/clickhouse-config.xml
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  dagit:
    build: .
    image: origo-dagster:latest
    ports:
      - "4000:3000"
    environment:
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - DAGSTER_HOME=/opt/app
      - PYTHONPATH=/opt/app
      - DAGSTER_WEBSERVER_URL=http://dagit:3000
      - DAGSTER_DEFAULT_IO_MANAGER_MODULE=origo.maintenance.io_manager
      - DAGSTER_DEFAULT_IO_MANAGER_ATTRIBUTE=packed_io_manager
      - ORIGO_METADATA_DRY_RUN=${ORIGO_METADATA_DRY_RUN:-true}
      - ORIGO_METADATA_MAX_RUNTIME_SECONDS=${ORIGO_METADATA_MAX_RUNTIME_SECONDS:-600}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGINGFACE_DATASET_REPO_ID=${HUGGINGFACE_DATASET_REPO_ID:-vaquum/binance_btcusdt_1m_klines}
      - ORIGO_TRADE_SPOOL_DIR=/opt/origo/spool
    volumes:
      - worker-heartbeats:/opt/origo/heartbeats:ro
      - trade-spool:/opt/origo/spool
      - .:/opt/app
      - dagster-instance:/opt/dagster-instance
      - source-locks:/opt/origo/locks
      - source-publications:/opt/origo/shadow
      - clickhouse-data:/opt/origo/clickhouse-data:ro
      - ./parquet_data:/opt/parquet
      - ./arrow_data:/opt/arrow
    depends_on:
      clickhouse:
        condition: service_healthy
    command: dagit -h 0.0.0.0 -p 3000
    restart: unless-stopped

  dagster:
    build: .
    image: origo-dagster:latest
    environment:
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - DAGSTER_HOME=/opt/app
      - PYTHONPATH=/opt/app
      - DAGSTER_WEBSERVER_URL=http://dagit:3000
      - DAGSTER_DEFAULT_IO_MANAGER_MODULE=origo.maintenance.io_manager
      - DAGSTER_DEFAULT_IO_MANAGER_ATTRIBUTE=packed_io_manager
      - ORIGO_METADATA_DRY_RUN=${ORIGO_METADATA_DRY_RUN:-true}
      - ORIGO_METADATA_MAX_RUNTIME_SECONDS=${ORIGO_METADATA_MAX_RUNTIME_SECONDS:-600}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGINGFACE_DATASET_REPO_ID=${HUGGINGFACE_DATASET_REPO_ID:-vaquum/binance_btcusdt_1m_klines}
      - ORIGO_TRADE_SPOOL_DIR=/opt/origo/spool
    volumes:
      - worker-heartbeats:/opt/origo/heartbeats:ro
      - trade-spool:/opt/origo/spool
      - .:/opt/app
      - dagster-instance:/opt/dagster-instance
      - source-locks:/opt/origo/locks
      - source-publications:/opt/origo/shadow
      - clickhouse-data:/opt/origo/clickhouse-data:ro
      - ./parquet_data:/opt/parquet
      - ./arrow_data:/opt/arrow
    depends_on:
      clickhouse:
        condition: service_healthy
    command: ["/bin/sh", "-ec", "python -m origo.sources.bootstrap && exec dagster-daemon run"]
    healthcheck:
      test: ["CMD", "python", "-m", "origo.sources.prepare", "--check"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  monitor:
    build: .
    image: origo-dagster:latest
    environment:
      - PYTHONPATH=/opt/app
      - DAGSTER_WEBSERVER_URL=http://dagit:3000
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      # Alerts stay disabled locally: the monitor logs findings when ORIGO_ALERT_* is unset.
      - ORIGO_ALERT_RESEND_API_KEY=${ORIGO_ALERT_RESEND_API_KEY:-}
      - ORIGO_ALERT_EMAIL_FROM=${ORIGO_ALERT_EMAIL_FROM:-}
      - ORIGO_ALERT_EMAIL_TO=${ORIGO_ALERT_EMAIL_TO:-}
    volumes:
      - source-locks:/opt/origo/locks
      - ./parquet_data:/opt/parquet:ro
      - ./arrow_data:/opt/arrow:ro
      - trade-spool:/opt/origo/spool:ro
      - .:/opt/app
      - worker-heartbeats:/opt/origo/heartbeats
      - source-publications:/opt/origo/shadow:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    command: python -m origo.workers.monitor
    healthcheck:
      test: ["CMD", "python", "-m", "origo.workers.monitor", "--check"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  vector:
    image: timberio/vector:0.58.0-alpine
    environment:
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}
      # Vector 0.58 leaves ${...} references in its configuration literal unless told to
      # interpolate them; the configuration is a read-only mount in a container that runs
      # nothing else.
      - VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/vector.yaml:/etc/vector/vector.yaml:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  depth-worker:
    build: .
    image: origo-dagster:latest
    environment:
      - PYTHONPATH=/opt/app
      - DAGSTER_WEBSERVER_URL=http://dagit:3000
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - BINANCE_SPOT_DEPTH20_BASE_URL=${BINANCE_SPOT_DEPTH20_BASE_URL:-}
      - BINANCE_SPOT_DEPTH20_AUTH_TOKEN=${BINANCE_SPOT_DEPTH20_AUTH_TOKEN:-}
      - BINANCE_SPOT_DEPTH200_BASE_URL=${BINANCE_SPOT_DEPTH200_BASE_URL:-}
      - BINANCE_SPOT_DEPTH200_AUTH_TOKEN=${BINANCE_SPOT_DEPTH200_AUTH_TOKEN:-}
    volumes:
      - .:/opt/app
      - ./arrow_data:/opt/arrow
      - source-locks:/opt/origo/locks
      - worker-heartbeats:/opt/origo/heartbeats
    depends_on:
      clickhouse:
        condition: service_healthy
    command: python -m origo.workers.depth
    healthcheck:
      test: ["CMD", "python", "-m", "origo.workers.depth", "--check"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  provisional-worker:
    build: .
    image: origo-dagster:latest
    environment:
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - PYTHONPATH=/opt/app
      - DAGSTER_WEBSERVER_URL=http://dagit:3000
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGINGFACE_DATASET_REPO_ID=${HUGGINGFACE_DATASET_REPO_ID:-vaquum/binance_btcusdt_1m_klines}
      # The REST and component beats land here; the worker main re-exports the same path.
      - ORIGO_WORKER_HEARTBEAT=/opt/origo/heartbeats/provisional.heartbeat
      - ORIGO_TRADE_SPOOL_DIR=/opt/origo/spool
    volumes:
      - trade-spool:/opt/origo/spool
      - .:/opt/app
      - ./parquet_data:/opt/parquet
      - ./arrow_data:/opt/arrow
      - source-locks:/opt/origo/locks
      - source-publications:/opt/origo/shadow
      - worker-heartbeats:/opt/origo/heartbeats
    depends_on:
      clickhouse:
        condition: service_healthy
    command: python -m origo.workers.provisional
    healthcheck:
      test: ["CMD", "python", "-m", "origo.workers.provisional", "--check"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  trade-capture:
    build: .
    image: origo-dagster:latest
    environment:
      - PYTHONPATH=/opt/app
      - ORIGO_TRADE_SPOOL_DIR=/opt/origo/spool
      - ORIGO_TRADE_SPOOL_MAX_BYTES=4294967296
    volumes:
      - trade-spool:/opt/origo/spool
      - source-locks:/opt/origo/locks
      - worker-heartbeats:/opt/origo/heartbeats
      - .:/opt/app
    command: python -m origo.workers.trade_capture
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-m", "origo.workers.trade_capture", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  clickhouse-data:
  dagster-instance:

  source-locks:

  source-publications:

  worker-heartbeats:

  trade-spool:
