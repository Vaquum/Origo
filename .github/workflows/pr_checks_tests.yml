name: pr_checks_tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner for the complete suite
        type: choice
        options: [server, github]
        default: server

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr_checks_tests:
    name: pr_checks_tests
    runs-on: ${{ fromJSON((inputs.runner == 'github' || vars.ORIGO_TESTS_RUNNER == 'github' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-latest"]' || '["self-hosted", "linux", "x64", "origo-tests"]') }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Register Python shared library
        run: |
          set -o pipefail
          python -c 'import sys; print(sys.base_prefix + "/lib")' | sudo tee /etc/ld.so.conf.d/origo-tests-python.conf
          sudo ldconfig

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip '.[dev]'

      - name: Install browser for dashboard acceptance
        run: |
          if [[ "${{ runner.environment }}" == 'self-hosted' ]]; then
            # The versioned runner image already installs Chromium system libraries.
            python -m playwright install chromium
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Run Origo source-native runtime tests
        shell: bash
        env:
          TEST_WORKERS: ${{ runner.environment == 'self-hosted' && '8' || '2' }}
        run: |
          mkdir -p test-results
          python -m pip freeze > test-results/dependencies.txt
          git rev-parse HEAD > test-results/source-sha.txt
          git rev-parse HEAD:tests/fixtures > test-results/fixtures-tree.txt
          pytest tests/origo_source_native --collect-only -q > test-results/collection.txt
          TEST_TMP="$RUNNER_TEMP/origo-pytest"
          mkdir -p "$TEST_TMP"
          if [[ "${{ runner.environment }}" == 'self-hosted' ]]; then
            # Disposable test files use at most 4GiB of the existing 24GiB guest RAM.
            sudo mount -t tmpfs -o size=4G,nosuid,nodev tmpfs "$TEST_TMP"
            sudo chown "$(id -u):$(id -g)" "$TEST_TMP"
            trap 'sudo umount "$TEST_TMP"' EXIT
          fi
          # Ordinary failures return before the dedicated resource qualification.
          pytest tests/origo_source_native -q --maxfail=1 -m 'not resource' --basetemp="$TEST_TMP/ordinary" -n "$TEST_WORKERS" --dist loadgroup --no-loadscope-reorder --durations=30 --junitxml=test-results/ordinary.xml | tee test-results/ordinary.log
          if [[ "${{ runner.environment }}" == 'self-hosted' ]]; then
            sudo umount "$TEST_TMP"
            trap - EXIT
          fi
          # A fresh, serial process preserves every original wall-clock/RSS limit.
          pytest tests/origo_source_native -q --maxfail=1 -m resource --durations=30 --junitxml=test-results/resources.xml | tee test-results/resources.log

      - name: Verify pinned acceptance outcomes
        run: python tools/tests_ci.py test-results/runtime.xml test-results/collection.txt --merge test-results/ordinary.xml test-results/resources.xml

      - name: Verify daily-archive fixture bundles
        run: |
          for stem in BTCUSDT-trades-2019-09-08 BTCUSDT-trades-2019-09-09 BTCUSDT-trades-2024-04-20; do
            python3 tools/fixture_bundle.py verify --dir tests/fixtures/binance/futures/daily/trades/BTCUSDT --stem "$stem"
          done
          for stem in BTCUSDT-trades-2017-08-17 BTCUSDT-trades-2020-01-01; do
            python3 tools/fixture_bundle.py verify --dir tests/fixtures/binance/spot/daily/trades/revisioned --stem "$stem"
          done

      - name: Upload runtime profiling and test outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-tests-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14
